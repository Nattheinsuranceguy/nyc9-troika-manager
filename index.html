<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC9 Troika Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8F7F4;color:#1a1a1a;min-height:100vh}

/* Header */
.hdr{background:#1F3864;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:10px}
.badge{width:36px;height:36px;border-radius:8px;background:#C9A84C;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#1F3864;flex-shrink:0}
.hdr-title{color:#fff;font-weight:700;font-size:17px}
.hdr-sub{color:#E8D28A;font-size:11px;font-weight:500}
.hdr-actions{display:flex;gap:8px;align-items:center}

/* Nav tabs */
.nav{background:#162d52;display:flex;padding:0 24px;gap:2px;overflow-x:auto}
.nav-tab{padding:11px 18px;font-size:13px;font-weight:600;color:#93B4D8;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none}
.nav-tab:hover{color:#fff}
.nav-tab.active{color:#C9A84C;border-bottom-color:#C9A84C}

/* Layout */
.main{max-width:1040px;margin:0 auto;padding:28px 20px 60px}

/* Stepbar */
.stepbar{display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.step-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.step-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:all .25s}
.step-lbl{font-size:11px;font-weight:500;white-space:nowrap;text-align:center}
.step-line{width:72px;height:2px;margin:0 6px;margin-bottom:20px;transition:background .25s}

/* Cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card-title{font-weight:700;font-size:14px;color:#1F3864;margin-bottom:4px}
.card-sub{font-size:12px;color:#718096;margin-bottom:12px}
.field-lbl{font-size:10px;font-weight:700;color:#a0aec0;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.inp{width:100%;padding:9px 12px;border:1px solid #E2E8F0;border-radius:8px;font-size:13px;color:#1F3864;background:#F8F7F4;font-family:inherit}
.inp:focus{outline:2px solid #1F3864;outline-offset:1px;background:#fff}
textarea.inp{resize:vertical;min-height:80px}
.grid-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}

/* Drop zone */
.drop-zone{border:2px dashed #E2E8F0;border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;background:#F8F7F4}
.drop-zone:hover,.drop-zone.over{border-color:#1F3864;background:#EEF2FF}
.drop-zone.has-file{border-color:#38A169;background:#F0FFF4}
.dz-icon{font-size:30px;margin-bottom:8px}
.dz-title{font-size:13px;font-weight:600;color:#1F3864}
.dz-hint{font-size:11px;color:#a0aec0;margin-top:4px}

/* Buttons */
.btn-navy{background:#1F3864;color:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;width:100%;letter-spacing:-.2px;transition:background .2s}
.btn-navy:hover{background:#2E4F8A}
.btn-gold{background:#C9A84C;border:none;color:#1F3864;padding:7px 15px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.btn-gold:disabled{opacity:.5;cursor:default}
.btn-ghost{background:transparent;border:1px solid #E8D28A;color:#E8D28A;padding:7px 15px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.btn-outline{background:transparent;border:1px solid #E2E8F0;color:#718096;padding:7px 13px;border-radius:7px;font-size:12px;cursor:pointer}
.btn-outline:hover{background:#F8F7F4}
.btn-sm{padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #E2E8F0;background:#fff;color:#1F3864}
.btn-sm:hover{background:#F8F7F4}

/* Generation */
.gen-box{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:40px;max-width:480px;margin:0 auto;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.07)}
.gen-icon{font-size:48px;margin-bottom:16px}
.gen-title{font-weight:700;font-size:20px;color:#1F3864;margin-bottom:20px}
.log-box{background:#F8F7F4;border-radius:10px;padding:16px;text-align:left}
.log-line{font-size:12px;color:#718096;padding:4px 0;border-bottom:1px solid #E2E8F0}
.log-line:last-child{border-bottom:none}
.dots{display:flex;gap:5px;justify-content:center;margin-top:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#C9A84C}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* Toolbar */
.toolbar{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.05);flex-wrap:wrap;gap:10px}
.tb-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb-title{font-weight:700;font-size:15px;color:#1F3864}
.count-badge{background:#2E4F8A;color:#fff;border-radius:5px;padding:2px 9px;font-size:11px;font-weight:600}
.tb-right{display:flex;gap:8px;flex-wrap:wrap}
.edit-hint{background:#EEF2FF;border:1px solid #2E4F8A;border-radius:9px;padding:10px 15px;font-size:12px;color:#2E4F8A;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px}

/* Troika cards */
.troika-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px;margin-bottom:22px}
.t-card{border-radius:12px;padding:14px 15px;border:2px solid transparent;transition:all .15s;min-height:120px}
.t-card.drag-over{border-color:#1F3864!important;box-shadow:0 0 0 3px rgba(30,64,136,.15)}
.t-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.t-num{background:#1F3864;color:#fff;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700}
.tag{border-radius:5px;padding:2px 6px;font-size:10px;font-weight:700;color:#fff;margin-left:5px}
.t-count{font-size:10px;color:#a0aec0}
.member-chip{display:flex;flex-direction:column;padding:6px 10px;background:#fff;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:all .15s}
.member-chip[draggable=true]{cursor:grab}
.member-chip[draggable=true]:hover{border-color:#1F3864;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.member-chip[draggable=true]:active{cursor:grabbing;opacity:.6}
.member-chip.dragging{opacity:.35}
.chip-row{display:flex;align-items:center;justify-content:space-between}
.chip-name{font-weight:700;font-size:12px;color:#1F3864}
.chip-role{font-size:10px;color:#a0aec0;margin-top:2px}
.rm-btn{width:20px;height:20px;border-radius:50%;background:#FED7D7;border:none;color:#E53E3E;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drop-hint{border:2px dashed #E2E8F0;border-radius:8px;padding:7px;text-align:center;font-size:10px;color:#a0aec0;margin-top:5px}
.t-note{font-size:10px;color:#a0aec0;font-style:italic;margin-top:9px;padding-top:8px;border-top:1px solid rgba(0,0,0,.07)}
.ua-box{border:2px dashed #E2E8F0;border-radius:12px;padding:15px;background:#fff;margin-bottom:20px;transition:all .2s}
.ua-box.pool-over{border-color:#E53E3E;background:#FFF5F5}
.ua-title{font-size:12px;font-weight:700;color:#718096;margin-bottom:10px}
.chip-pool{display:flex;flex-wrap:wrap;gap:8px}
.pool-chip{padding:5px 11px;background:#fff;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;font-weight:700;color:#1F3864;cursor:grab;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pool-chip:hover{border-color:#1F3864}

/* Footer bar */
.footer-bar{background:#1F3864;border-radius:12px;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-info{color:#fff;font-size:13px}
.sep{color:#C9A84C;margin:0 10px}
.footer-actions{display:flex;gap:10px}

/* ── HISTORY TAB ── */
.hist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.hist-title{font-weight:800;font-size:22px;color:#1F3864}
.hist-sub{font-size:13px;color:#718096;margin-top:3px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.05);text-align:center}
.stat-num{font-size:32px;font-weight:800;color:#1F3864;line-height:1}
.stat-lbl{font-size:11px;color:#718096;margin-top:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* Search & filter bar */
.filter-bar{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.search-inp{flex:1;min-width:180px;padding:7px 12px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px;color:#1F3864;background:#F8F7F4}
.search-inp:focus{outline:2px solid #1F3864;outline-offset:1px}
.filter-sel{padding:7px 11px;border:1px solid #E2E8F0;border-radius:7px;font-size:12px;color:#1F3864;background:#F8F7F4;cursor:pointer}

/* Member table */
.member-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.member-table th{background:#1F3864;color:#fff;padding:11px 14px;font-size:11px;font-weight:700;text-align:left;letter-spacing:.4px;text-transform:uppercase}
.member-table td{padding:10px 14px;font-size:12px;border-bottom:1px solid #F0F4F8;vertical-align:middle}
.member-table tr:last-child td{border-bottom:none}
.member-table tr:hover td{background:#F8FAFF}
.status-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.pill-active{background:#C6F6D5;color:#276749}
.pill-gl{background:#FEFCBF;color:#744210}
.pill-guest{background:#E2E8F0;color:#4A5568}
.pill-candidate{background:#E9D8FD;color:#553C9A}
.attend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 2px}
.dot-yes{background:#38A169}
.dot-no{background:#E2E8F0}

/* Meeting timeline */
.timeline{margin-bottom:28px}
.tl-header{font-weight:700;font-size:14px;color:#1F3864;margin-bottom:14px}
.mtg-card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.mtg-head{background:#1F3864;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.mtg-head-left{display:flex;align-items:center;gap:12px}
.mtg-name{color:#fff;font-weight:700;font-size:14px}
.mtg-date{color:#93B4D8;font-size:12px}
.mtg-badges{display:flex;gap:8px}
.mtg-badge{background:rgba(255,255,255,.15);color:#fff;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:600}
.mtg-chevron{color:#93B4D8;font-size:14px;transition:transform .2s}
.mtg-chevron.open{transform:rotate(180deg)}
.mtg-body{padding:16px 18px;display:none}
.mtg-body.open{display:block}
.mtg-troika-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mtg-troika{border-radius:9px;padding:10px 12px;border:1px solid #E2E8F0}
.mtg-troika-num{font-size:11px;font-weight:700;color:#1F3864;margin-bottom:6px}
.mtg-member{font-size:11px;color:#4A5568;padding:2px 0;display:flex;align-items:center;gap:5px}
.mtg-member::before{content:"•";color:#C9A84C;font-size:10px}

/* Pairing matrix */
.matrix-section{margin-top:28px}
.matrix-title{font-weight:700;font-size:14px;color:#1F3864;margin-bottom:14px}
.matrix-wrap{overflow-x:auto;border-radius:12px;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.matrix-table{border-collapse:collapse;min-width:100%;background:#fff}
.matrix-table th{background:#1F3864;color:#fff;padding:8px 10px;font-size:10px;font-weight:700;white-space:nowrap;text-align:center;letter-spacing:.3px}
.matrix-table th.row-lbl{text-align:left;padding-left:12px;position:sticky;left:0;z-index:2}
.matrix-table td{padding:6px 8px;border:1px solid #F0F4F8;text-align:center;font-size:11px;min-width:36px}
.matrix-table td.name-cell{text-align:left;font-weight:600;color:#1F3864;font-size:11px;white-space:nowrap;padding-left:12px;background:#fff;position:sticky;left:0;z-index:1;border-right:2px solid #E2E8F0}
.matrix-cell-0{background:#F8F7F4;color:#a0aec0}
.matrix-cell-1{background:#C6F6D5;color:#276749;font-weight:700}
.matrix-cell-2{background:#68D391;color:#fff;font-weight:800}
.matrix-cell-3{background:#38A169;color:#fff;font-weight:800}
.matrix-cell-self{background:#1F3864;color:#1F3864}

.err{color:#E53E3E;font-size:12px;margin-top:8px}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.mem-card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative;transition:all .2s}
.mem-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.mem-card.inactive{opacity:.5}
.mem-name{font-weight:700;font-size:14px;color:#1F3864;margin-bottom:2px}
.mem-title{font-size:11px;color:#718096;margin-bottom:4px}
.mem-company{font-size:12px;font-weight:600;color:#4A5568;margin-bottom:6px}
.mem-role{font-size:11px;color:#2E75B6;background:#EEF2FF;padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:8px}
.mem-contact{font-size:11px;color:#718096;display:flex;flex-direction:column;gap:2px}
.mem-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #F0F4F8}
.mem-status{position:absolute;top:12px;right:12px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:16px;padding:28px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-title{font-weight:700;font-size:18px;color:#1F3864;margin-bottom:20px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #E2E8F0}
.btn-danger{background:#FED7D7;color:#E53E3E;border:none;padding:8px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.btn-success{background:#C6F6D5;color:#276749;border:none;padding:8px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.empty-state{text-align:center;padding:48px 24px;color:#a0aec0}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:700;color:#718096;margin-bottom:6px}
.empty-sub{font-size:13px}
</style>
</head>

function renderTCard(t,i){

      <div style="display:flex;align-items:center;gap:5px">
        <span class="t-num">Troika ${t.number}</span>
        ${isQ?`<span class="tag" style="background:#6B46C1">QUAD</span>`:""}
        ${t.type==="Requested"?`<span class="tag" style="background:#C9A84C;color:#1F3864">REQ</span>`:""}
      </div>
      <span class="t-count">${t.members.length} members</span>
    </div>
    ${t.members.map((m,mi)=>`
      <div class="member-chip${state.dragging&&state.dragging.name===m.name&&state.dragFrom===i?" dragging":""}"
        draggable="${state.editMode}"
        ondragstart="dragStart(event,'${esc(m.name)}',${i})"
        ondragend="dragEnd()">
        <div class="chip-row">
          <span class="chip-name">${escHtml(m.name)}</span>
          ${state.editMode?`<button class="rm-btn" onclick="removeMember(${i},${mi})">×</button>`:""}
        </div>
        ${m.role?`<span class="chip-role">${escHtml(m.role)}</span>`:""}
      </div>`).join("")}
    ${state.editMode&&t.members.length<4?`<div class="drop-hint">Drop member here</div>`:""}
    ${t.note?`<div class="t-note">✎ ${escHtml(t.note)}</div>`:""}
  </div>`;
}

// Drag handlers
function dragStart(e,name,fromIdx){
  const m=state.troikas[fromIdx]?.members.find(m=>m.name===name);
  if(!m)return;
  state.dragging=m;state.dragFrom=fromIdx;state.dragFromType="troika";
}
function dragStartPool(i){state.dragging=state.unassigned[i];state.dragFrom=i;state.dragFromType="pool";}
function dragEnd(){clearDrag();}
function dragOver(e,idx){
  e.preventDefault();
  document.querySelectorAll(".t-card").forEach(c=>c.classList.remove("drag-over"));
  document.getElementById(`tc-${idx}`)?.classList.add("drag-over");
}
function dragLeave(idx){document.getElementById(`tc-${idx}`)?.classList.remove("drag-over");}
function dropOn(e,toIdx){
  e.preventDefault();
  document.querySelectorAll(".t-card").forEach(c=>c.classList.remove("drag-over"));
  if(!state.dragging)return;
  if(state.dragFromType==="pool"){
    if(state.troikas[toIdx].members.length>=4){clearDrag();return;}
    state.troikas=state.troikas.map((t,i)=>i===toIdx?{...t,members:[...t.members,state.dragging]}:t);
    state.unassigned=state.unassigned.filter((_,i)=>i!==state.dragFrom);
  }else{
    if(state.dragFrom===toIdx||state.troikas[toIdx].members.length>=4){clearDrag();return;}
    const moved=state.dragging;
    state.troikas=state.troikas.map((t,i)=>{
      if(i===state.dragFrom)return{...t,members:t.members.filter(m=>m.name!==moved.name)};
      if(i===toIdx)return{...t,members:[...t.members,moved]};
      return t;
    }).filter(t=>t.members.length>0).map((t,i)=>({...t,number:i+1}));
  }
  clearDrag();renderStep3();
}
function clearDrag(){state.dragging=null;state.dragFrom=null;state.dragFromType=null;}
function removeMember(ti,mi){
  const m=state.troikas[ti].members[mi];
  state.troikas=state.troikas.map((t,i)=>i===ti?{...t,members:t.members.filter((_,j)=>j!==mi)}:t)
    .filter(t=>t.members.length>0).map((t,i)=>({...t,number:i+1}));
  state.unassigned=[...state.unassigned,m];
  renderStep3();
}
function toggleEdit(){state.editMode=!state.editMode;renderStep3();}
function addTroika(){
  state.troikas=[...state.troikas,{number:state.troikas.length+1,type:"Role-based",note:"New group",why:"",members:[]}];
  renderStep3();
}
function goStep(n){state.step=n;renderBuild();}

// Generate
async function startGenerate(){
  state.genLog=[];state.isGenerating=true;state.step=2;renderBuild();
  const log=m=>{state.genLog=[...state.genLog,m];renderStep2();};
  log("📄 Reading attendee information...");await sleep(600);
  log("🔍 Processing pairing requests...");await sleep(500);
  log("🧠 Analyzing member roles and building candidates...");await sleep(700);
  // Send text prompt only — PDF base64 causes server timeouts
  const userContent=[{type:"text",text:buildPrompt()}];
  try{
    log("⚡ Generating optimal pairings with AI...");
    const res=await fetch("/.netlify/functions/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,messages:[{role:"user",content:userContent}]})
    });
    const data=await res.json();
    if(!res.ok){
      const errMsg=data.error?.message||data.error||`API error ${res.status}`;
      throw new Error(typeof errMsg==="object"?JSON.stringify(errMsg):errMsg);
    }
    const rawText=data.content?.find(b=>b.type==="text")?.text||"";
    log("🔍 Parsing Troika groups...");await sleep(300);

    let parsed={troikas:[],unassigned:[]};
    const tryParse=(str)=>{
      // Strip markdown fences if present
      str=str.replace(/```json/gi,"").replace(/```/g,"").trim();
      // Find outermost JSON object
      const start=str.indexOf("{");
      const end=str.lastIndexOf("}");
      if(start!==-1&&end!==-1&&end>start){
        return JSON.parse(str.slice(start,end+1));
      }
      return JSON.parse(str);
    };

    try{
      parsed=tryParse(rawText);
    }catch(e){
      // Ask AI to reformat its own output as clean JSON
      log("🔄 Cleaning up AI response format...");
      try{
        const fixRes=await fetch("/.netlify/functions/generate",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,messages:[
            {role:"user",content:buildPrompt()},
            {role:"assistant",content:rawText},
            {role:"user",content:"Please reformat your response as pure JSON only — no markdown, no backticks, no explanation. Start with { and end with }. Keep all the same Troika pairings you just created."}
          ]})
        });
        const fixData=await fixRes.json();
        const fixText=fixData.content?.find(b=>b.type==="text")?.text||"";
        parsed=tryParse(fixText);
      }catch(e2){
        log("⚠ Could not read AI response. Please try again.");
      }
    }

    if(!parsed.troikas?.length){
      log("⚠ No Troikas returned. Try again or check your PDF.");
    } else {
      const memberCount=parsed.troikas.reduce((s,t)=>s+(t.members?.length||0),0);
      log(`✅ ${parsed.troikas.length} Troikas created — ${memberCount} attendees paired!`);
    }
    await sleep(200);
    state.troikas=parsed.troikas||[];state.unassigned=parsed.unassigned||[];
  }catch(err){
    log("❌ Error: " + err.message);
    log("⚠ Please check your internet connection and try again.");
    state.troikas=[];state.unassigned=[];
  }
  state.isGenerating=false;renderStep2();
}

  return `You are the NYC9 Troika group leader. Create 3-person Troika pairings for today's meeting.

RULES: Pair EVERY attendee. Never include Natale Scopelliti. Honor specific requests first. Pair by complementary roles. Groups of 3 preferred, Quad (4) if needed. Each person in exactly one Troika.

ABSENT — exclude these people entirely:
${state.absences || "None."}

PAIRING REQUESTS — honor these first:
${state.requests || "None."}

EXTRA INSTRUCTIONS:
${state.instructions || "None."}

${state.pdfName ? `PDF photolist "${state.pdfName}" was uploaded — pair ALL attendees listed in it.` : "No PDF — use the requests and instructions above to determine who attended."}

Output ONLY raw JSON starting with { and ending with }. No markdown. No explanation.
{"troikas":[{"number":1,"type":"Role-based","note":"reason","why":"why","members":[{"name":"Name","role":"Role","company":"Co"},{"name":"Name","role":"Role","company":"Co"},{"name":"Name","role":"Role","company":"Co"}]}],"unassigned":[]}
Begin with { now:`;
}
